<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes - InventSoft</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="reportes">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar" data-title="Reportes"></header>
    <div class="content">
      <div class="page-head"><h1>Reportes de trazabilidad</h1><p>Consulta los movimientos por fecha y categoría, con su responsable y orden de trabajo.</p></div>

      <div class="card">
        <div class="filters">
          <div class="field"><label for="rep-desde">Desde</label><input id="rep-desde" type="date" value="2025-09-03"></div>
          <div class="field"><label for="rep-hasta">Hasta</label><input id="rep-hasta" type="date" value="2025-09-10"></div>
          <div class="field"><label for="rep-cat">Categoría</label><select id="rep-cat"></select></div>
        </div>
        <div class="table-wrap"><table id="t-rep"><thead><tr><th>Fecha</th><th>Material</th><th>Categoría</th><th>Tipo</th><th>Cantidad</th><th>Responsable</th><th>Referencia</th></tr></thead><tbody id="tbl-rep"></tbody></table></div>
        <div class="actions" style="margin-top:16px">
          <button class="btn cyan" data-export="table" data-target="#t-rep" data-name="reporte-kardex">Exportar a Excel</button>
          <button class="btn cyan" data-export="pdf">Exportar a PDF</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
