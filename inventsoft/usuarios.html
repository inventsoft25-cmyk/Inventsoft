<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios y roles - InventSoft</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="usuarios">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar" id="topbar" data-title="Usuarios y roles"></header>
      <div class="content">
        <div class="page-head">
          <h1>Personal y roles</h1>
          <p>Administra quién puede entrar al sistema y con qué rol.</p>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:40px;text-align:center"><input type="checkbox" id="select-all-usr"
                      aria-label="Seleccionar todos"></th>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tbl-usr"></tbody>
            </table>
          </div>
          <div class="actions" style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"> <button class="btn"
              id="btn-nuevo-usuario" type="button">+ Registrar usuario nuevo</button> <button class="btn danger"
              id="btn-eliminar-usuario" type="button">Eliminar usuario</button> </div>
        </div> <!-- Formulario / Tarjeta para registrar nuevo usuario -->
        <div class="card" id="card-nuevo-usr" style="margin-top:20px;display:none;">
          <div class="card-title">
            <h2>Registrar nuevo usuario</h2> <button class="btn sm ghost" id="btn-cerrar-form-usr"
              type="button">Cancelar</button>
          </div>
          <form class="form" id="form-nuevo-usr">
            <div class="field"><label for="usr-nombre">Nombre completo</label><input id="usr-nombre" type="text"
                placeholder="Ej.: Juan Pérez" required></div>
            <div class="field"><label for="usr-correo">Correo electrónico</label><input id="usr-correo" type="email"
                placeholder="usuario@inventsoft.com" required></div>
            <div class="field"><label for="usr-rol">Rol asignado</label> <select id="usr-rol" required>
                <option value="Administrador">Administrador</option>
                <option value="Operario" selected>Operario</option>
                <option value="Usuario">Usuario</option>
              </select> </div>
            <div class="full"><button class="btn" type="submit">Guardar usuario</button></div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>

</html>
