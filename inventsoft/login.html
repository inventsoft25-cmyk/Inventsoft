<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - InventSoft</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="split"> <!-- Sección azul izquierda con soporte de Logo / Fondo ordenado -->
    <section class="left login-brand-side"> <!-- Marca de agua / Imagen de fondo con el logo del proyecto -->
      <div class="login-bg-watermark" aria-hidden="true"> <img src="img/logo.png.png" alt="logo inventsoft"
          onerror="this.style.display='none'"> </div> <!-- Contenedor ordenado de marca y contenidos superiores -->
      <div class="login-brand-header"> <!-- Logo del proyecto visible en cabecera -->
        <div class="brand-logo-wrap"> <img class="brand-logo-img" src="img/logo.png.png" alt="Logo de InventSoft"
            onerror="this.parentElement.classList.add('no-img')"> <span class="brand-text">InventSoft</span> </div>
      </div>
      <div class="login-brand-content">
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresa para revisar el stock, registrar movimientos y atender las alertas del taller.</p>
      </div>
      <div class="demo"> <strong>Credenciales de demostración</strong><br> Correo: <code>admin@inventsoft.com</code><br>
        Clave: <code>admin1234</code> </div>
      <div class="login-brand-footer"> <a href="index.html" style="color:#dbe6ff">← Volver al inicio</a> </div>
    </section>
    <section class="right">
      <form class="login-box" id="login-form" novalidate>
        <h1>Iniciar sesión</h1>
        <div class="field"><label for="correo">Correo electrónico</label><input id="correo" type="email"
            value="admin@inventsoft.com" autocomplete="username" required></div>
        <div class="field"><label for="clave">Contraseña</label><input id="clave" type="password" value="admin1234"
            autocomplete="current-password" required></div>
        <div class="error" id="login-error" role="alert"></div> <button class="btn" type="submit">Iniciar
          sesión</button> <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </form>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>

</html>
