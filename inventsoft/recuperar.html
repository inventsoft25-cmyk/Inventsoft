<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña - InventSoft</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="split">
  <section class="left">
    <div class="brand" style="padding:0">InventSoft</div>
    <h1>Recupera tu acceso</h1>
    <p>Escribe el correo de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.</p>
  </section>
  <section class="right">
    <form class="login-box" id="rec-form">
      <h1>Recuperar contraseña</h1>
      <div class="field"><label for="rec-correo">Correo electrónico</label><input id="rec-correo" type="email" required></div>
      <button class="btn" type="submit">Enviar enlace</button>
      <a href="login.html">Volver a iniciar sesión</a>
    </form>
  </section>
</div>

<script src="js/app.js"></script>
</body>
</html>
