<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exportar datos - InventSoft</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="exportar">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar" data-title="Exportar datos"></header>
    <div class="content">
      <div class="page-head"><h1>Exportar a Excel o PDF</h1><p>Elige los módulos y el formato de descarga.</p></div>

      <div class="card">
        <h2 style="margin-bottom:14px">Módulos</h2>
        <div class="grid g2">
          <label class="check"><input type="checkbox" name="mod" value="inventario" checked> Inventario</label>
          <label class="check"><input type="checkbox" name="mod" value="movimientos"> Entradas y salidas</label>
          <label class="check"><input type="checkbox" name="mod" value="pedidos"> Pedidos a proveedores</label>
          <label class="check"><input type="checkbox" name="mod" value="usuarios"> Usuarios y roles</label>
        </div>
        <h2 style="margin:20px 0 14px">Formato</h2>
        <div class="grid g2">
          <label class="check"><input type="radio" name="fmt" value="excel" checked> Excel (archivo CSV)</label>
          <label class="check"><input type="radio" name="fmt" value="pdf"> PDF (imprimir la página)</label>
        </div>
        <div class="actions" style="margin-top:20px"><button class="btn cyan" data-export="modules">Descargar</button></div>
      </div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
