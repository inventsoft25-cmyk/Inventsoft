<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario - InventSoft</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="inventario">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar" data-title="Inventario"></header>
    <div class="content">
      <div class="page-head"><h1>Inventario de materiales</h1><p>Catálogo de láminas, pinturas y consumibles del taller.</p></div>

      <div class="card">
        <div class="filters">
          <div class="field"><label for="desde">Desde</label><input id="desde" type="date" value="2025-09-03"></div>
          <div class="field"><label for="hasta">Hasta</label><input id="hasta" type="date" value="2025-09-10"></div>
          <div class="field grow"><label for="buscar">Buscar material</label><input id="buscar" type="search" placeholder="Nombre, código o categoría"></div>
          <a class="btn cyan" href="entradas.html">Registrar material</a>
        </div>
        <div class="table-wrap"><table id="t-inv">
          <thead><tr><th>Código</th><th>Material</th><th>Categoría</th><th>Unidad</th><th>Stock</th><th>Mínimo</th><th>Estado</th></tr></thead>
          <tbody id="tbl-inv"></tbody></table></div>
        <div class="actions" style="margin-top:16px">
          <button class="btn cyan" data-export="table" data-target="#t-inv" data-name="inventario">Exportar a Excel</button>
          <button class="btn cyan" data-export="pdf">Exportar a PDF</button>
          <button class="btn cyan" data-export="chart">Generar gráfico</button>
        </div>
      </div>
      <div class="grid g2" id="charts" style="margin-top:20px">
        <div class="card"><h2 style="margin-bottom:14px">Unidades en stock por categoría</h2><div class="bars" id="chart-bars"></div><div class="bar-labels" id="chart-labels"></div></div>
        <div class="card"><h2 style="margin-bottom:14px">Distribución por estado</h2><div class="donut-wrap"><div class="donut" id="chart-donut" role="img" aria-label="Gráfico circular de estados de stock"></div><div class="legend" id="chart-legend"></div></div></div>
      </div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
