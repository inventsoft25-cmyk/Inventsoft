<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niveles de stock - InventSoft</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="niveles">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar" data-title="Niveles de stock"></header>
    <div class="content">
      <div class="page-head"><h1>Niveles mínimos de stock</h1><p>Define el mínimo de cada material. Al llegar a ese valor se dispara la alerta.</p></div>

      <div class="card">
        <div class="table-wrap"><table><thead><tr><th>Material</th><th>Stock actual</th><th>Mínimo</th><th>Estado</th></tr></thead><tbody id="tbl-niv"></tbody></table></div>
        <div class="actions" style="margin-top:16px"><button class="btn" id="niv-guardar">Guardar niveles</button><button class="btn ghost" id="reset-demo">Restablecer datos de demostración</button></div>
      </div>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
